apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medicure-ingress
  namespace: prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: medicure.example.com   # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medicure
                port:
                  number: 80
