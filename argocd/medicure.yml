apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicure
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medicure
  template:
    metadata:
      labels:
        app: medicure
    spec:
      containers:
        - name: medicure
          image: 54.208.219.146:30500/medicure:0.0.1-30
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: nexus-creds
---
apiVersion: v1
kind: Service
metadata:
  name: medicure
  namespace: prod
spec:
  selector:
    app: medicure
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
  type: Nodeport
